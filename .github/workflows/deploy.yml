name: Atualização, Compilação Rust e Deploy

on:
  schedule:
    # Executa toda segunda-feira às 08:00 UTC (05:00 da manhã no horário de Brasília)
    - cron: '0 8 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Build Rust Server
        run: cargo build --release --manifest-path rust-server/Cargo.toml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python Crawler
        run: python updater.py

      - name: Copy Compiled Executables to Bin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Copy-Item -Path rust-server/target/release/rust-server.exe -Destination bin/server.exe -Force

      - name: Commit and Push Updates
        shell: pwsh
        continue-on-error: true
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          try {
            git add src/data/database.ts bin/server.exe
            $staged = git diff --cached --name-only
            if ($staged) {
              Write-Host "Novas atualizações regulatórias ou binário compilado encontrados! Enviando..."
              git commit -m "auto: atualização de normas (Python) e servidor compilado (Rust) [scraped]"
              git push
            } else {
              Write-Host "Nenhuma alteração detectada nas legislações ou binários hoje."
            }
          } catch {
            Write-Warning "Falha na atualizacao do repositorio Git. Prosseguindo..."
          }
          
          exit 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Next.js Static Site
        run: npm run build

      - name: Deploy to GitHub Pages
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cd out
          New-Item -ItemType File -Name ".nojekyll" -Force
          
          git init
          git checkout -b gh-pages
          git add .
          git commit -m "deploy: GitHub Pages build [static]"
          
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
