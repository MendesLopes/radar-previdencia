name: Atualização e Deploy (Next.js)

on:
  schedule:
    # Executa todos os dias às 08:00 UTC (05:00 da manhã no horário de Brasília)
    - cron: '0 8 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para commit do crawler e deploy no gh-pages

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Crawler Scraper
        run: python updater.py

      - name: Commit and Push Database Update
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Verifica se database.ts foi alterado pelo crawler
          if [ -n "$(git status --porcelain src/data/database.ts)" ]; then
            echo "Novas atualizações regulatórias encontradas! Commitando..."
            git add src/data/database.ts
            git commit -m "auto: atualização diária de normas em database.ts [scraped]"
            git push
          else
            echo "Nenhuma nova alteração detectada nas legislações hoje."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Next.js Static Site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out # Next.js static build outputs to 'out' folder
          branch: gh-pages # Deploys static build to 'gh-pages' branch
          clean: true
